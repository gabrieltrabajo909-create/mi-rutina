<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181F">
<title>Mi Rutina</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --ground:#F2F3F5; --surface:#FFFFFF; --sunk:#E6E8EC; --ink:#161A21; --muted:#667080; --line:#D8DCE2;
  --good:#1F8A5B; --good-soft:#D4EEE0; --bad:#C2412F; --bad-soft:#F6DCD7; --mid:#C98A12; --accent:#2B5FD9; --accent-ink:#FFFFFF;
  --font:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --ground:#0F1217; --surface:#171B22; --sunk:#0A0C10; --ink:#E7EAF0; --muted:#8B94A3; --line:#262C36;
    --good:#43C487; --good-soft:#15352A; --bad:#EF6F5C; --bad-soft:#3A1D19; --mid:#E5AB3C; --accent:#6D97FF; --accent-ink:#0B1020;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.4 var(--font);-webkit-tap-highlight-color:transparent}
.wrap{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(60px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
button,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.tabs{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.tabs button{padding:7px 13px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}

.day{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.nav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.nav:disabled{opacity:.2}
.date{text-align:center}
.date .rel{font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.date .abs{font:500 13px var(--mono);color:var(--muted);margin-top:2px}
.score{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);transition:width .3s}
.score span{font:600 14px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}

.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:64px}
.row:first-child{border-top:0}
.info{flex:1;min-width:0}
.name{font-weight:600;line-height:1.25}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:600 11.5px var(--mono);padding:2px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.ok{background:var(--good-soft);color:var(--good)}

.chk{flex:none;width:44px;height:44px;border-radius:13px;border:2px solid var(--line);display:grid;place-items:center}
.chk svg{width:22px;height:22px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.chk.on{background:var(--good);border-color:var(--good)}
.chk.on svg{opacity:1}
.seg{flex:none;display:flex;gap:6px}
.seg button{min-width:52px;height:44px;padding:0 10px;border-radius:12px;border:2px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on.good{background:var(--good);border-color:var(--good);color:#fff}
.seg button.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on.pick{background:var(--good);border-color:var(--good);color:#fff}

h2{font-size:17px;margin:0;font-weight:800}
.sec{display:flex;flex-direction:column;gap:10px}
.weekhead{display:flex;align-items:center;justify-content:space-between}
.weekhead .nav{width:36px;height:36px}
.gridbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11px var(--mono);color:var(--muted);padding:4px 2px;text-align:center}
th:first-child{text-align:left;padding-left:6px}
td{padding:5px 2px;text-align:center;border-top:1px solid var(--line)}
td.t{text-align:left;padding-left:6px;font-weight:600;font-size:13px;line-height:1.2}
td.c span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--sunk);font:700 10px var(--mono);color:#fff}
td.c span.g{background:var(--good)} td.c span.b{background:var(--bad)}
td.c.today span{outline:2px solid var(--ink);outline-offset:1px}
td.n{font:600 12px var(--mono);white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
td.n.ok{color:var(--good)}
.weeks{display:flex;flex-direction:column;gap:6px}
.wk{display:grid;grid-template-columns:7.5em 1fr 3.2em;gap:10px;align-items:center;font-size:13px}
.wk .l{font:500 12px var(--mono);color:var(--muted)}
.wk .b{height:10px;border-radius:9px;background:var(--sunk);overflow:hidden}
.wk .b i{display:block;height:100%;background:var(--good)}
.wk .p{font:600 12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card p{margin:0;font-size:14px;color:var(--muted)}
.card b{color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:11px 16px;border-radius:12px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;background:var(--ground);padding:10px;font:12px var(--mono);resize:vertical}
.note{min-height:110px;font:15px/1.45 var(--font);background:var(--surface);border-radius:18px;padding:12px 14px}
.notes{display:flex;flex-direction:column;gap:8px}
.notes .card{gap:4px}
.notes .d{font:600 12px var(--mono);color:var(--muted)}
.notes .x{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.muted{margin:0;color:var(--muted);font-size:14px}
.score .big{font-weight:800;font-size:34px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:2.6em}
.score .big small{font-size:16px;font-weight:700;margin-left:1px}
.hi{color:var(--good)} .mid{color:var(--mid)} .lo{color:var(--bad)}
.bar i.hi,.wk .b i.hi{background:var(--good)} .bar i.mid,.wk .b i.mid{background:var(--mid)} .bar i.lo,.wk .b i.lo{background:var(--bad)}
tr.sc td{border-top:2px solid var(--line);font:700 12px var(--mono);font-variant-numeric:tabular-nums}
tr.sc td.t{font:700 13px var(--font)}
.wk{grid-template-columns:7.5em 1fr 3em 4.2em!important}
.wk .o{font:500 11px var(--mono);color:var(--muted);text-align:right}
.ed{gap:10px}
.edtop{display:flex;align-items:center;gap:4px}
.in{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--ground);color:var(--ink);font:500 15px var(--font);padding:9px 10px}
.in.name{flex:1;font-weight:700;font-size:16px}
.edgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.edgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.ico:disabled{opacity:.25}
.ico svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.delc{flex:none;height:38px;padding:0 10px;border-radius:10px;background:var(--bad);color:#fff;font-weight:700;font-size:13px}
.extras{display:flex;flex-wrap:wrap;gap:8px}
.xchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 6px 6px 12px;font-size:14px}
.xchip b{color:var(--good)}
.xchip button{width:24px;height:24px;border-radius:50%;background:var(--sunk);font-weight:700;line-height:1}
.xadd{display:flex;gap:8px}
.xadd .in:first-child{flex:1}
.xadd select{width:auto}
.btn.ghost.danger{background:none;border:1px solid var(--line);color:var(--bad);font-weight:600}
.grip{width:34px;height:40px;display:grid;place-items:center;color:var(--muted);flex:none;touch-action:none;cursor:grab}
.ed{transition:transform .15s}
.ed.dragging{transition:none;position:relative;z-index:2;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.warn{color:var(--bad)!important;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Mi Rutina</div>
    <div class="tabs" role="tablist">
      <button id="tab-day" role="tab" aria-selected="true">Hoy</button>
      <button id="tab-week" role="tab" aria-selected="false">Semana</button>
      <button id="tab-edit" role="tab" aria-selected="false">Tareas</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// Tareas iniciales. Después se editan desde la pestaña "Tareas" y quedan guardadas en el teléfono.
// type: check = hecho / no hecho · pick = elegir una opción (cuenta como hecho) · yesno = Sí / No, "good" es la respuesta buena
// goal = veces por semana (7 = todos los días)
const DEFAULT_TASKS = [
  { id:'bjjvid',  name:'Video de BJJ',      note:'30 min',       type:'check', goal:7 },
  { id:'bjj',     name:'BJJ',               note:'',             type:'pick',  options:['Gi','No Gi'], goal:3 },
  { id:'push',    name:'Gym Push',          note:'calistenia',   type:'check', goal:2 },
  { id:'pull',    name:'Gym Pull',          note:'calistenia',   type:'check', goal:2 },
  { id:'ai',      name:'Curso de AI',       note:'30 min',       type:'check', goal:7 },
  { id:'redpill', name:'Red Pill',          note:'15 min',       type:'check', goal:7 },
  { id:'lead',    name:'Leadership skills', note:'15 min',       type:'check', goal:7 },
  { id:'comer',   name:'Comer bien',        note:'',             type:'yesno', good:'Sí', goal:7 },
  { id:'fap',     name:'Fap',               note:'objetivo: No', type:'yesno', good:'No', goal:7 },
];

(() => {
  const $ = s => document.querySelector(s);
  const DOW = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MON = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
  const shift = (k, n) => { const d = parse(k); d.setDate(d.getDate()+n); return key(d); };
  const today = () => key(new Date());
  const weekStart = k => shift(k, -parse(k).getDay());   // semana de domingo a sábado
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const L = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>';
  const R = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>';
  const GRIP = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
  const IC = {
    up:'<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
    down:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
    del:'<svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>'
  };

  // ---------- datos: guardados en el teléfono ----------
  const LS = 'mi-rutina-v1';
  let data = { days: {} };
  try { const d = JSON.parse(localStorage.getItem(LS)); if (d && d.days) data = d; } catch {}
  if (!Array.isArray(data.tasks)) data.tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
  const tasks = () => data.tasks;
  // Cada día guarda una "foto" de las tareas que había (_snap). Los días pasados usan su foto,
  // así cambiar, reordenar o borrar tareas no altera lo que ya pasó. Hoy siempre sigue las tareas actuales.
  const snapOf = () => JSON.parse(JSON.stringify(tasks()));
  function freeze(){
    const t = today();
    for (const k in data.days) if (k < t && !data.days[k]._snap) data.days[k]._snap = snapOf();
    if (data.days[t]) data.days[t]._snap = snapOf();
  }
  const tasksFor = k => (k < today() && data.days[k] && data.days[k]._snap) || tasks();
  function save(){ freeze(); try { localStorage.setItem(LS, JSON.stringify(data)); } catch { toast('No se pudo guardar en este teléfono.'); } }
  const hasRecord = k => { const d = data.days[k]; return !!d && Object.keys(d).some(x => x !== '_snap'); };

  const state = { view: 'day', cur: today(), week: weekStart(today()), confirmDel: null, confirmDay: null, confirmWeek: null };
  freeze(); try { localStorage.setItem(LS, JSON.stringify(data)); } catch {}

  // good = cumple el objetivo, bad = respuesta mala, null = sin marcar
  function status(task, k){
    const v = (data.days[k] || {})[task.id];
    if (v == null) return null;
    if (task.type === 'yesno') return v === task.good ? 'good' : 'bad';
    return 'good';
  }
  function weekCount(task, ws){ let n = 0; for (let i = 0; i < 7; i++) if (status(task, shift(ws, i)) === 'good') n++; return n; }

  // Puntaje del día: % de tareas cumplidas, cada una con su "vale" (x1 a x5, para tareas largas
  // como trabajar 8 h). El orden de la lista no cambia el peso.
  // Las diarias cuentan siempre; las de "X por semana" solo suman el día que las hacés.
  // Los extras del día (ej. "Moto +10") suman puntos directo y pueden pasar el 100%.
  function dayScore(k){
    const T = tasksFor(k);
    let den = 0, num = 0;
    T.forEach(t => {
      const w = t.peso || 1, ok = status(t, k) === 'good';
      if (t.goal >= 7) { den += w; if (ok) num += w; }
      else if (ok) { den += w; num += w; }
    });
    const extra = ((data.days[k] || {})._extra || []).reduce((s, e) => s + e.p, 0);
    return (den ? Math.round(num / den * 100) : 0) + extra;
  }
  const scoreCls = s => s >= 80 ? 'hi' : s >= 50 ? 'mid' : 'lo';

  function setVal(id, v){
    const k = state.cur, d = { ...(data.days[k] || {}) };
    if (v == null) delete d[id]; else d[id] = v;
    if (Object.keys(d).length) data.days[k] = d; else delete data.days[k];
    save();
    if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
    render();
  }
  function saveNote(k, txt){
    const d = { ...(data.days[k] || {}) };
    if (txt.trim()) d._note = txt; else delete d._note;
    if (Object.keys(d).length) data.days[k] = d; else delete data.days[k];
    save();
  }

  function relLabel(k){ const t = today(); if (k === t) return 'Hoy'; if (k === shift(t,-1)) return 'Ayer'; const s = DOW[parse(k).getDay()]; return s[0].toUpperCase() + s.slice(1); }
  function absLabel(k){ const d = parse(k); return `${DOW[d.getDay()]} ${d.getDate()} de ${MON[d.getMonth()]} ${d.getFullYear()}`; }
  function shortLabel(k){ const d = parse(k); return `${d.getDate()} ${MON[d.getMonth()]}`; }
  const goalTxt = g => g >= 7 ? 'todos los días' : `${g} por semana`;

  function render(){
    ['day','week','edit'].forEach(v => $('#tab-' + v).setAttribute('aria-selected', state.view === v));
    ({ day: renderDay, week: renderWeek, edit: renderEdit })[state.view]();
  }

  function renderDay(){
    const k = state.cur, vals = data.days[k] || {}, ws = weekStart(k), T = tasksFor(k);
    const sc = dayScore(k), extras = vals._extra || [];
    const rows = T.map(t => {
      const v = vals[t.id], wc = weekCount(t, ws);
      let ctl;
      if (t.type === 'check') ctl = `<button class="chk${v ? ' on' : ''}" data-id="${esc(t.id)}" data-v="1" aria-label="${esc(t.name)}" aria-pressed="${!!v}">${CHECK}</button>`;
      else {
        const opts = t.type === 'pick' ? (t.options || []) : ['Sí', 'No'];
        ctl = '<div class="seg">' + opts.map(o => {
          const cls = v === o ? 'on ' + (t.type === 'pick' ? 'pick' : (o === t.good ? 'good' : 'bad')) : '';
          return `<button class="${cls}" data-id="${esc(t.id)}" data-v="${esc(o)}" aria-pressed="${v === o}">${esc(o)}</button>`;
        }).join('') + '</div>';
      }
      return `<div class="row"><div class="info"><div class="name">${esc(t.name)}</div>
        <div class="meta">${t.note ? `<span>${esc(t.note)}</span>` : ''}<span>${goalTxt(t.goal)}</span>${(t.peso || 1) > 1 ? `<span class="chip">vale x${t.peso}</span>` : ''}<span class="chip${wc >= t.goal ? ' ok' : ''}">${wc}/${t.goal} sem</span></div></div>${ctl}</div>`;
    }).join('');
    $('#view').innerHTML = `<div class="sec" style="gap:16px">
      <div class="day"><button class="nav" id="prev" aria-label="Día anterior">${L}</button>
        <div class="date"><div class="rel">${relLabel(k)}</div><div class="abs">${absLabel(k)}</div></div>
        <button class="nav" id="next" aria-label="Día siguiente" ${k >= today() ? 'disabled' : ''}>${R}</button></div>
      <div class="score"><div class="big ${scoreCls(sc)}">${sc}<small>%</small></div><div class="bar"><i class="${scoreCls(sc)}" style="width:${Math.min(sc, 100)}%"></i></div><span>puntaje</span></div>
      ${T.length ? `<div class="list">${rows}</div>` : '<div class="card"><p>No tenés tareas. Agregalas en la pestaña <b>Tareas</b>.</p></div>'}
      <div class="sec"><h2>Extras del día</h2>
        <p class="muted">Algo que hiciste aparte y suma al puntaje (andar en moto, una mudanza…).</p>
        ${extras.length ? `<div class="extras">${extras.map((e, i) => `<span class="xchip">${esc(e.n)} <b>+${e.p}%</b><button data-x="${i}" aria-label="Quitar">×</button></span>`).join('')}</div>` : ''}
        <form class="xadd" id="xform"><input class="in" id="xname" placeholder="ej. Moto" maxlength="40" autocomplete="off">
          <select class="in" id="xpts">${[5, 10, 15, 20, 25, 30].map(p => `<option value="${p}" ${p === 10 ? 'selected' : ''}>+${p}%</option>`).join('')}</select>
          <button class="btn" type="submit">Sumar</button></form></div>
      <div class="sec"><h2>Notas del día</h2><textarea class="note" id="note" placeholder="Qué hiciste hoy, qué practicaste en BJJ, cómo te sentiste…">${esc(vals._note || '')}</textarea></div>
      ${k < today() && hasRecord(k) ? `<button class="btn ghost danger" id="delday">${state.confirmDay === k ? '¿Seguro? Tocá de nuevo para borrar' : 'Borrar el registro de este día'}</button>` : ''}
    </div>`;
    $('#prev').onclick = () => { state.cur = shift(k, -1); state.confirmDay = null; render(); };
    $('#next').onclick = () => { if (k < today()) { state.cur = shift(k, 1); state.confirmDay = null; render(); } };
    document.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
      const t = T.find(t => t.id === b.dataset.id), v = b.dataset.v, cur = vals[t.id];
      if (t.type === 'check') setVal(t.id, cur ? null : 1);
      else setVal(t.id, cur === v ? null : v);   // tocar de nuevo desmarca
    });
    $('#xform').onsubmit = e => {
      e.preventDefault();
      const n = $('#xname').value.trim(); if (!n) return $('#xname').focus();
      const dd = { ...(data.days[k] || {}) }; dd._extra = [...(dd._extra || []), { n, p: +$('#xpts').value }];
      data.days[k] = dd; save(); render();
    };
    document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => {
      const dd = { ...data.days[k] }; dd._extra = dd._extra.filter((_, i) => i !== +b.dataset.x);
      if (!dd._extra.length) delete dd._extra; data.days[k] = dd; save(); render();
    });
    const dbtn = $('#delday');
    if (dbtn) dbtn.onclick = () => {
      if (state.confirmDay !== k) { state.confirmDay = k; return render(); }
      delete data.days[k]; state.confirmDay = null; save(); toast('Registro del día borrado'); render();
    };
    let nt;
    $('#note').oninput = e => { clearTimeout(nt); const txt = e.target.value; nt = setTimeout(() => saveNote(k, txt), 400); };
    $('#note').onblur = e => { clearTimeout(nt); saveNote(k, e.target.value); };
  }

  // tareas que existieron en una semana: las actuales (si incluye hoy) más las de las fotos de cada día
  function weekTasks(ws){
    const t = today(), m = new Map();
    if (shift(ws, 6) >= t) tasks().forEach(x => m.set(x.id, x));
    for (let i = 6; i >= 0; i--) { const k = shift(ws, i); if (k <= t) tasksFor(k).forEach(x => { if (!m.has(x.id)) m.set(x.id, x); }); }
    return [...m.values()];
  }
  function renderWeek(){
    const ws = state.week, t = today(), days = [...Array(7)].map((_, i) => shift(ws, i)), T = weekTasks(ws);
    const head = '<tr><th>Tarea</th>' + ['D','L','M','M','J','V','S'].map(x => `<th>${x}</th>`).join('') + '<th></th></tr>';
    const body = T.map(task => {
      const cells = days.map(k => {
        const s = status(task, k), v = (data.days[k] || {})[task.id];
        const txt = task.type === 'pick' && v ? v.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2) : '';
        return `<td class="c${k === t ? ' today' : ''}"><span class="${s === 'good' ? 'g' : s === 'bad' ? 'b' : ''}">${k > t ? '' : esc(txt)}</span></td>`;
      }).join('');
      const n = weekCount(task, ws);
      return `<tr><td class="t">${esc(task.name)}</td>${cells}<td class="n${n >= task.goal ? ' ok' : ''}">${n}/${task.goal}</td></tr>`;
    }).join('');
    const scoreRow = '<tr class="sc"><td class="t">Puntaje</td>' + days.map(k => {
      if (k > t) return '<td></td>';
      const s = dayScore(k); return `<td><b class="${scoreCls(s)}">${s}</b></td>`;
    }).join('') + `<td class="n">${weekAvg(ws)}%</td></tr>`;
    const weeks = [...Array(8)].map((_, i) => {
      const w = shift(weekStart(t), -7 * i), avg = weekAvg(w);
      const WT = weekTasks(w), met = WT.filter(task => weekCount(task, w) >= task.goal).length;
      return `<div class="wk"><div class="l">${i === 0 ? 'esta semana' : 'sem ' + shortLabel(w)}</div><div class="b"><i class="${scoreCls(avg)}" style="width:${Math.min(avg, 100)}%"></i></div><div class="p">${avg}%</div><div class="o">${met}/${WT.length} obj</div></div>`;
    }).join('');
    const notes = days.filter(k => (data.days[k] || {})._note).map(k => `<div class="card"><div class="d">${absLabel(k)}</div><div class="x">${esc(data.days[k]._note)}</div></div>`).join('');
    $('#view').innerHTML = `<div class="sec" style="gap:18px">
      <div class="sec"><div class="weekhead"><button class="nav" id="wprev" aria-label="Semana anterior">${L}</button>
        <h2>${shortLabel(ws)} – ${shortLabel(shift(ws, 6))}</h2>
        <button class="nav" id="wnext" aria-label="Semana siguiente" ${ws >= weekStart(t) ? 'disabled' : ''}>${R}</button></div>
        <div class="gridbox"><table>${head}${body}${scoreRow}</table></div></div>
      <div class="sec"><h2>Notas de la semana</h2>${notes ? `<div class="notes">${notes}</div>` : '<p class="muted">Sin notas esta semana.</p>'}</div>
      <div class="sec"><h2>Puntaje promedio por semana</h2><div class="card weeks">${weeks}</div></div>
      ${days.some(k => k < t && hasRecord(k)) ? `<button class="btn ghost danger" id="delweek">${state.confirmWeek === ws ? '¿Seguro? Tocá de nuevo para borrar' : 'Borrar los registros de esta semana'}</button>` : ''}
    </div>`;
    $('#wprev').onclick = () => { state.week = shift(ws, -7); state.confirmWeek = null; render(); };
    $('#wnext').onclick = () => { if (ws < weekStart(t)) { state.week = shift(ws, 7); state.confirmWeek = null; render(); } };
    const wb = $('#delweek');
    if (wb) wb.onclick = () => {
      if (state.confirmWeek !== ws) { state.confirmWeek = ws; return render(); }
      days.forEach(k => { if (k < t) delete data.days[k]; });   // hoy no se toca
      state.confirmWeek = null; save(); toast('Registros de la semana borrados'); render();
    };
  }
  // promedio de los días de la semana hasta hoy
  function weekAvg(ws){
    const t = today(); let sum = 0, n = 0;
    for (let i = 0; i < 7; i++) { const k = shift(ws, i); if (k > t) break; sum += dayScore(k); n++; }
    return n ? Math.round(sum / n) : 0;
  }

  function renderEdit(){
    const T = tasks();
    const goalOpts = g => [1,2,3,4,5,6,7].map(n => `<option value="${n}" ${n === g ? 'selected' : ''}>${n === 7 ? 'Todos los días' : n + ' por semana'}</option>`).join('');
    const cards = T.map((t, i) => `<div class="card ed" data-i="${i}">
      <div class="edtop"><span class="grip" aria-label="Arrastrar para mover" title="Arrastrar para mover">${GRIP}</span><input class="in name" data-f="name" value="${esc(t.name)}" placeholder="Nombre de la tarea" aria-label="Nombre" maxlength="60">
        ${state.confirmDel === t.id ? '<button class="delc" data-a="del">¿Borrar?</button>' : `<button class="ico del" data-a="ask" aria-label="Borrar">${IC.del}</button>`}</div>
      <div class="edgrid">
        <label>Detalle<input class="in" data-f="note" value="${esc(t.note || '')}" placeholder="ej. 30 min" maxlength="40"></label>
        <label>Objetivo<select class="in" data-f="goal">${goalOpts(t.goal)}</select></label>
        <label>Vale<select class="in" data-f="peso">${[1,2,3,4,5].map(n => `<option value="${n}" ${n === (t.peso || 1) ? 'selected' : ''}>${n === 1 ? 'Normal' : 'x' + n}</option>`).join('')}</select></label>
        <label>Cómo se marca<select class="in" data-f="type">
          <option value="check" ${t.type === 'check' ? 'selected' : ''}>Hecho ✓</option>
          <option value="yesno" ${t.type === 'yesno' ? 'selected' : ''}>Sí / No</option>
          <option value="pick" ${t.type === 'pick' ? 'selected' : ''}>Opciones</option></select></label>
        ${t.type === 'yesno' ? `<label>Respuesta buena<select class="in" data-f="good"><option ${t.good !== 'No' ? 'selected' : ''}>Sí</option><option ${t.good === 'No' ? 'selected' : ''}>No</option></select></label>` : ''}
        ${t.type === 'pick' ? `<label>Opciones (separadas por coma)<input class="in" data-f="options" value="${esc((t.options || []).join(', '))}" placeholder="Gi, No Gi"></label>` : ''}
      </div></div>`).join('');
    $('#view').innerHTML = `<div class="sec" style="gap:12px">
      <h2>Tus tareas</h2>
      ${cards}
      <button class="btn" id="add">+ Agregar tarea</button>
      <p class="muted">Mantené apretado <b>⠿</b> y arrastrá para ordenar (el orden no cambia el puntaje). Con <b>Vale</b> le das más peso a una tarea (ej. Trabajo 8 h → x4). Los cambios valen desde hoy: los días que ya pasaron no se modifican.</p>
    </div>`;
    document.querySelectorAll('.ed').forEach(card => {
      const i = +card.dataset.i, t = T[i];
      card.querySelectorAll('[data-f]').forEach(inp => inp.onchange = () => {
        const f = inp.dataset.f; let v = inp.value;
        if (f === 'name') { v = v.trim(); if (!v) { inp.value = t.name; return; } }
        if (f === 'goal' || f === 'peso') v = +v;
        if (f === 'options') { v = v.split(',').map(s => s.trim()).filter(Boolean); if (!v.length) v = ['Hecho']; }
        t[f] = v;
        if (f === 'type') { if (v === 'yesno' && !t.good) t.good = 'Sí'; if (v === 'pick' && !(t.options || []).length) t.options = ['Opción 1', 'Opción 2']; }
        save();
        if (f === 'type') render();
      });
      card.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
        const a = b.dataset.a;
        if (a === 'ask') { state.confirmDel = t.id; return render(); }
        if (a === 'del') { T.splice(i, 1); toast(`"${t.name}" borrada`); }
        state.confirmDel = null; save(); render();
      });
    });
    // arrastrar desde ⠿ para reordenar
    document.querySelectorAll('.grip').forEach(g => g.onpointerdown = e => {
      e.preventDefault();
      const card = g.closest('.ed'), from = +card.dataset.i, cards = [...document.querySelectorAll('.ed')];
      const mids = cards.map(c => { const r = c.getBoundingClientRect(); return r.top + r.height / 2; });
      const y0 = e.clientY; let to = from;
      try { g.setPointerCapture(e.pointerId); } catch {}
      card.classList.add('dragging');
      g.onpointermove = ev => {
        const dy = ev.clientY - y0; card.style.transform = `translateY(${dy}px)`;
        const y = mids[from] + dy; to = mids.filter(m => m < y).length - (y > mids[from] ? 1 : 0);
        to = Math.max(0, Math.min(cards.length - 1, to));
        const h = card.getBoundingClientRect().height + 12;
        cards.forEach((c, j) => { if (j === from) return; c.style.transform = from < to && j > from && j <= to ? `translateY(${-h}px)` : from > to && j < from && j >= to ? `translateY(${h}px)` : ''; });
      };
      g.onpointerup = g.onpointercancel = () => {
        g.onpointermove = g.onpointerup = g.onpointercancel = null;
        if (to !== from) { const [m] = T.splice(from, 1); T.splice(to, 0, m); save(); }
        render();
      };
    });
    $('#add').onclick = () => {
      T.push({ id: uid(), name: 'Nueva tarea', note: '', type: 'check', goal: 7 });
      state.confirmDel = null; save(); render();
      const last = document.querySelectorAll('.ed .name'); const inp = last[last.length - 1];
      inp.scrollIntoView({ block: 'center' }); inp.focus(); inp.select();
    };
  }

  let tt;
  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3200); }

  $('#tab-day').onclick = () => { state.view = 'day'; render(); };
  $('#tab-week').onclick = () => { state.view = 'week'; state.week = weekStart(state.cur); render(); };
  $('#tab-edit').onclick = () => { state.view = 'edit'; state.confirmDel = null; render(); };
  let lastToday = today();
  setInterval(() => { const t = today(); if (t !== lastToday) { if (state.cur === lastToday) state.cur = t; lastToday = t; if (state.view !== 'edit') render(); } }, 60000);
  render();
  // pedir al teléfono que no borre los datos, y funcionar sin internet
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
